name: tpm2tss-snapcraft
base: core22
version: '1.2.0'
summary: Snap package for OpenSSL TPM2-TSS engine
description: |
  This snap stages OpenSSL together with the TPM2-TSS engine and tools,
  making the TPM2 engine available inside the snap runtime.

grade: stable
confinement: strict

apps:
  openssl:
    command: usr/bin/openssl
    environment:
      OPENSSL_MODULES: $SNAP/usr/lib/x86_64-linux-gnu/ossl-modules
    plugs: [tpm]

parts:
  tpm2-tss:
    plugin: autotools
    source: https://github.com/tpm2-software/tpm2-tss
    source-type: git
    source-tag: 4.1.0
    autotools-configure-parameters:
      - --prefix=/usr
      - --enable-fapi
      - --with-crypto=ossl
      - --disable-doxygen-doc
    build-packages:
      - autoconf
      - autoconf-archive
      - libtool
      - gcc
      - libgcrypt20-dev
      - libjson-c-dev
      - libssl-dev
      - libltdl-dev
      - libcurl4-openssl-dev
      - uuid-dev
    stage-packages:
      - libcurl4
      - libssl3
      - libjson-c5
    prime:
      - -include

  tpm2-openssl:
    plugin: autotools
    source: https://github.com/tpm2-software/tpm2-openssl
    source-type: git
    source-tag: 1.2.0
    autotools-configure-parameters:
      - --prefix=/usr
      - --with-modulesdir=/usr/lib/x86_64-linux-gnu/ossl-modules
    build-packages:
      - autoconf
      - autoconf-archive
      - pkg-config
      - libssl-dev
      - libtool
    after:
      - tpm2-tss
    prime:
      - usr/lib/x86_64-linux-gnu/ossl-modules/tpm2.so

  openssl:
    plugin: nil
    stage-packages:
      - openssl
    prime:
      - usr/bin/openssl
      - usr/lib/x86_64-linux-gnu/libssl*
      - usr/lib/x86_64-linux-gnu/libcrypto*
      - usr/lib/x86_64-linux-gnu/ossl-modules/
